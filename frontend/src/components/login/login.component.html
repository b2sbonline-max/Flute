<div class="login-container">
  <div class="login-card">
    <h1>FLUTE CRM</h1>
    <h2>התחברות למערכת</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" dir="rtl">
      <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

      <div class="form-group">
        <label for="username">שם משתמש</label>
        <input formControlName="username" type="text" class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f['username'].errors }" />
      </div>

      <div class="form-group">
        <label for="password">סיסמה</label>
        <input formControlName="password" type="password" class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f['password'].errors }" />
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
        <span *ngIf="!loading">התחברות</span>
        <span *ngIf="loading"><span class="spinner-border spinner-border-sm mr-2"></span>מעבדת...</span>
      </button>
    </form>
  </div>
</div>

<style>
  .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
  .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); width: 100%; max-width: 400px; }
  h1 { text-align: center; color: #333; margin-bottom: 10px; }
  h2 { text-align: center; color: #666; font-size: 18px; margin-bottom: 30px; }
  .form-group { margin-bottom: 20px; }
  label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; }
  .form-control { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
  .form-control:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
  .btn-primary { background: #667eea; border: none; padding: 12px; font-size: 16px; font-weight: 600; color: white; cursor: pointer; border-radius: 4px; }
  .btn-primary:hover:not(:disabled) { background: #5a67d8; }
  .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
  .alert-danger { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; padding: 12px; border-radius: 4px; margin-bottom: 20px; }
</style>
